[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dukascopy-downloader"
version = "1.0.0"
description = "Robust downloader for Dukascopy historical data (jetta.dukascopy.com API)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.25", "pandas>=1.5", "numpy>=1.21", "pyarrow>=10"]

[project.optional-dependencies]
progress = ["tqdm"]

[project.scripts]
duka = "dukascopy_downloader.cli:main"

[tool.setuptools]
packages = ["dukascopy_downloader"]
